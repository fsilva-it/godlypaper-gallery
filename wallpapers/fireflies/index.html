<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050a0e; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// Fireflies at dusk — GodlyPaper web wallpaper.
// Static background (sky gradient + treeline) is rendered ONCE to an
// offscreen canvas and blitted each frame; fireflies are a pre-rendered
// glow sprite drawn additively. Per-frame cost: 1 + N drawImage calls.

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

var count = 45;
var speed = 1;
var glow = { r: 255, g: 214, b: 115 }; // warm yellow

var paused = false;
var flies = [];
var bg = null;       // offscreen background canvas
var sprite = null;   // offscreen glow sprite
var SPR = 96;        // sprite size in px (drawn scaled)
var lastT = 0;

// ---------- deterministic RNG so the treeline is stable across resizes ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- background: dusk gradient + horizon glow + two treeline layers ----------
function buildBackground() {
  var w = canvas.width, h = canvas.height;
  bg = document.createElement("canvas");
  bg.width = w;
  bg.height = h;
  var b = bg.getContext("2d");

  // Sky: near-black dusk blue fading into green-black toward the horizon.
  var sky = b.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0.0, "#04070c");
  sky.addColorStop(0.45, "#071310");
  sky.addColorStop(0.75, "#0a1a12");
  sky.addColorStop(1.0, "#050d09");
  b.fillStyle = sky;
  b.fillRect(0, 0, w, h);

  // Faint warm afterglow band low on the horizon, behind the trees.
  var gy = h * 0.74;
  var halo = b.createRadialGradient(w * 0.5, gy, 0, w * 0.5, gy, w * 0.55);
  halo.addColorStop(0, "rgba(70, 54, 28, 0.20)");
  halo.addColorStop(0.6, "rgba(45, 38, 20, 0.08)");
  halo.addColorStop(1, "rgba(0, 0, 0, 0)");
  b.fillStyle = halo;
  b.fillRect(0, gy - w * 0.55, w, w * 1.1);

  // Two conifer treeline layers (far = lighter, near = darkest).
  drawTreeline(b, w, h, 0.80, 0.055, 0.14, "#08130d", mulberry32(1337));
  drawTreeline(b, w, h, 0.90, 0.075, 0.19, "#030704", mulberry32(9001));
}

function drawTreeline(b, w, h, baseFrac, minHF, maxHF, color, rnd) {
  var base = h * baseFrac;
  b.fillStyle = color;
  b.beginPath();
  b.moveTo(0, h);
  b.lineTo(0, base);
  var x = 0;
  while (x < w) {
    var tw = (0.02 + rnd() * 0.045) * w;              // tree width
    var th = (minHF + rnd() * (maxHF - minHF)) * h;   // tree height
    var jitter = (rnd() - 0.5) * h * 0.01;            // uneven bases
    var cx = x + tw * 0.5;
    // simple conifer: a triangle with a small notch on each flank
    b.lineTo(x, base + jitter);
    b.lineTo(cx - tw * 0.18, base + jitter - th * 0.45);
    b.lineTo(cx - tw * 0.10, base + jitter - th * 0.45);
    b.lineTo(cx, base + jitter - th);
    b.lineTo(cx + tw * 0.10, base + jitter - th * 0.45);
    b.lineTo(cx + tw * 0.18, base + jitter - th * 0.45);
    b.lineTo(x + tw, base + jitter);
    x += tw * (0.55 + rnd() * 0.35); // overlap trees a little
  }
  b.lineTo(w, base);
  b.lineTo(w, h);
  b.closePath();
  b.fill();
}

// ---------- glow sprite: tinted radial gradient, rebuilt only on color change ----------
function buildSprite() {
  sprite = document.createElement("canvas");
  sprite.width = SPR;
  sprite.height = SPR;
  var s = sprite.getContext("2d");
  var c = SPR / 2;
  var g = s.createRadialGradient(c, c, 0, c, c, c);
  // hot near-white core -> body color -> transparent falloff
  var coreR = Math.min(255, glow.r + 90);
  var coreG = Math.min(255, glow.g + 90);
  var coreB = Math.min(255, glow.b + 90);
  g.addColorStop(0.0, "rgba(" + coreR + "," + coreG + "," + coreB + ",1)");
  g.addColorStop(0.12, "rgba(" + glow.r + "," + glow.g + "," + glow.b + ",0.9)");
  g.addColorStop(0.35, "rgba(" + glow.r + "," + glow.g + "," + glow.b + ",0.28)");
  g.addColorStop(1.0, "rgba(" + glow.r + "," + glow.g + "," + glow.b + ",0)");
  s.fillStyle = g;
  s.fillRect(0, 0, SPR, SPR);
}

// ---------- fireflies ----------
function seed() {
  flies = [];
  var w = canvas.width, h = canvas.height, dpr = devicePixelRatio || 1;
  for (var i = 0; i < count; i++) {
    flies.push({
      x: Math.random() * w,
      y: h * (0.32 + Math.random() * 0.62),
      a: Math.random() * Math.PI * 2,             // heading
      spd: (9 + Math.random() * 13) * dpr,        // px/s, slow wander
      r: (9 + Math.random() * 11) * dpr,          // glow radius
      // smooth noise-ish turning = sum of two slow sines, unique per fly
      wf1: 0.13 + Math.random() * 0.22,
      wf2: 0.31 + Math.random() * 0.35,
      wp1: Math.random() * Math.PI * 2,
      wp2: Math.random() * Math.PI * 2,
      // independent pulse cycle (one flash every ~3-7 s)
      pf: (Math.PI * 2) / (3 + Math.random() * 4),
      pp: Math.random() * Math.PI * 2
    });
  }
}

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  buildBackground();
  seed();
}
addEventListener("resize", resize);
resize();
buildSprite();

// ---------- animation ----------
function frame(now) {
  if (!paused) {
    if (!lastT) lastT = now;
    var dt = Math.min(0.05, (now - lastT) / 1000); // clamp so tab throttling never jumps
    lastT = now;
    var t = now / 1000;
    var w = canvas.width, h = canvas.height;
    var yTop = h * 0.28, yBot = h * 0.97;
    var m = 40 * (devicePixelRatio || 1); // off-screen wrap margin

    ctx.drawImage(bg, 0, 0);
    ctx.globalCompositeOperation = "lighter";

    for (var i = 0; i < flies.length; i++) {
      var f = flies[i];

      // wander: smoothly turn the heading with two slow sines
      f.a += (Math.sin(t * f.wf1 * 6 + f.wp1) + Math.sin(t * f.wf2 * 6 + f.wp2)) * 0.6 * dt;
      var v = f.spd * speed;
      f.x += Math.cos(f.a) * v * dt;
      f.y += Math.sin(f.a) * v * dt;

      // gently pull back into the dwelling band (above ground, below sky)
      if (f.y < yTop) f.y += (yTop - f.y) * 0.6 * dt;
      else if (f.y > yBot) f.y += (yBot - f.y) * 0.6 * dt;

      // horizontal wrap happens fully off-screen, so it is invisible
      if (f.x < -m) f.x = w + m;
      else if (f.x > w + m) f.x = -m;

      // pulse: long dim rest, then a soft bright flash
      var s = Math.sin(t * f.pf * speed + f.pp);
      var b = 0.10 + (s > 0 ? s * s * s * 0.9 : 0);

      var r = f.r * (0.75 + b * 0.35); // glow swells slightly while flashing
      ctx.globalAlpha = b;
      ctx.drawImage(sprite, f.x - r, f.y - r, r * 2, r * 2);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  } else {
    lastT = 0; // avoid a dt jump on resume
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- GodlyPaper / Wallpaper Engine property API ----------
function weColor(v) {
  var p = String(v).split(" ").map(parseFloat);
  return { r: Math.round(p[0] * 255), g: Math.round(p[1] * 255), b: Math.round(p[2] * 255) };
}

window.wallpaperPropertyListener = {
  applyUserProperties: function (props) {
    if (props.count) { count = Math.round(Number(props.count.value)); seed(); }
    if (props.speed) speed = Number(props.speed.value);
    if (props.glowcolor) { glow = weColor(props.glowcolor.value); buildSprite(); }
  },
  setPaused: function (value) { paused = value; }
};
</script>
</body>
</html>
