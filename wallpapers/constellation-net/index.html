<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070c18; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// Constellation Net — slow-drifting points joined by distance-faded lines.

var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

// --- user properties (defaults mirror manifest.json) ---
var pointCount = 70;
var speed = 1;                              // global drift multiplier
var lineColor = { r: 184, g: 209, b: 255 }; // soft white-blue ("0.72 0.82 1")
var paused = false;

// --- tunables ---
var BASE_DRIFT = 7;        // px/sec at dpr 1, speed 1
var MAX_LINE_ALPHA = 0.34; // opacity of the shortest links
var DOT_ALPHA = 0.85;
var BUCKETS = 12;          // quantized alpha levels (precomputed styles)
var MAX_DT = 0.1;          // clamp dt across pauses/occlusion (seconds)

var points = [];           // {x, y, vx, vy, r}  (device px; vx/vy unit-ish dir * variance)
var linkDist = 0;          // link threshold, device px
var linkDistSq = 0;
var bgGradient = null;     // cached — rebuilt only on resize
var lineStyles = [];       // per-bucket rgba strings — rebuilt only on color change
var dotStyle = "";

// Reused per-frame bucket storage (flat x1,y1,x2,y2 runs; no per-frame allocs after warmup).
var bucketSegs = [];
var bucketLens = new Array(BUCKETS);
for (var b = 0; b < BUCKETS; b++) bucketSegs.push([]);

function rebuildStyles() {
  var c = lineColor.r + "," + lineColor.g + "," + lineColor.b;
  lineStyles.length = 0;
  for (var i = 0; i < BUCKETS; i++) {
    var a = MAX_LINE_ALPHA * (i + 1) / BUCKETS;
    lineStyles.push("rgba(" + c + "," + a.toFixed(3) + ")");
  }
  dotStyle = "rgba(" + c + "," + DOT_ALPHA + ")";
}

function rebuildBackground() {
  bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bgGradient.addColorStop(0, "#060a15");   // deep navy, top
  bgGradient.addColorStop(1, "#0b1326");   // slightly lighter navy, bottom
}

function makePoint() {
  var a = Math.random() * Math.PI * 2;
  var v = 0.5 + Math.random();             // per-point drift variance
  return {
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: Math.cos(a) * v,
    vy: Math.sin(a) * v,
    r: (1.1 + Math.random() * 0.9)         // dot radius at dpr 1
  };
}

function syncPointCount() {
  while (points.length < pointCount) points.push(makePoint());
  if (points.length > pointCount) points.length = pointCount;
}

function resize() {
  var ow = canvas.width, oh = canvas.height;
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  if (ow > 0 && oh > 0) {                  // keep the layout, rescale in place
    var sx = canvas.width / ow, sy = canvas.height / oh;
    for (var i = 0; i < points.length; i++) { points[i].x *= sx; points[i].y *= sy; }
  }
  linkDist = Math.min(canvas.width, canvas.height) * 0.17;
  linkDistSq = linkDist * linkDist;
  rebuildBackground();
}

addEventListener("resize", resize);
resize();
syncPointCount();
rebuildStyles();

function update(dt) {
  var w = canvas.width, h = canvas.height;
  var step = BASE_DRIFT * devicePixelRatio * speed * dt;
  for (var i = 0; i < points.length; i++) {
    var p = points[i];
    p.x += p.vx * step;
    p.y += p.vy * step;
    if (p.x < 0)      { p.x = 0; p.vx = -p.vx; }
    else if (p.x > w) { p.x = w; p.vx = -p.vx; }
    if (p.y < 0)      { p.y = 0; p.vy = -p.vy; }
    else if (p.y > h) { p.y = h; p.vy = -p.vy; }
  }
}

function draw() {
  var i, j, n = points.length;

  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Bucket line segments by quantized opacity (squared-distance early reject).
  for (i = 0; i < BUCKETS; i++) bucketLens[i] = 0;
  for (i = 0; i < n; i++) {
    var a = points[i];
    for (j = i + 1; j < n; j++) {
      var dx = a.x - points[j].x;
      var dy = a.y - points[j].y;
      var d2 = dx * dx + dy * dy;
      if (d2 >= linkDistSq) continue;
      var t = 1 - Math.sqrt(d2) / linkDist;              // 0..1, near = bright
      var bi = Math.min(BUCKETS - 1, (t * BUCKETS) | 0);
      var seg = bucketSegs[bi], k = bucketLens[bi];
      seg[k] = a.x; seg[k + 1] = a.y; seg[k + 2] = points[j].x; seg[k + 3] = points[j].y;
      bucketLens[bi] = k + 4;
    }
  }

  // One path + stroke per opacity bucket.
  ctx.lineWidth = 0.8 * devicePixelRatio;
  for (i = 0; i < BUCKETS; i++) {
    var len = bucketLens[i];
    if (len === 0) continue;
    var s = bucketSegs[i];
    ctx.strokeStyle = lineStyles[i];
    ctx.beginPath();
    for (j = 0; j < len; j += 4) {
      ctx.moveTo(s[j], s[j + 1]);
      ctx.lineTo(s[j + 2], s[j + 3]);
    }
    ctx.stroke();
  }

  // Points on top, one path.
  ctx.fillStyle = dotStyle;
  ctx.beginPath();
  for (i = 0; i < n; i++) {
    var p = points[i], r = p.r * devicePixelRatio;
    ctx.moveTo(p.x + r, p.y);
    ctx.arc(p.x, p.y, r, 0, 7);
  }
  ctx.fill();
}

var last = performance.now();
function frame(now) {
  if (!paused) {
    var dt = Math.min((now - last) / 1000, MAX_DT);
    update(dt);
    draw();
  }
  last = now;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// WE-format "r g b" float string -> 0-255 channels
function weColor(v) {
  var p = String(v).split(" ").map(parseFloat);
  return { r: Math.round(p[0] * 255), g: Math.round(p[1] * 255), b: Math.round(p[2] * 255) };
}

window.wallpaperPropertyListener = {
  applyUserProperties: function (props) {
    if (props.pointcount) { pointCount = Math.round(Number(props.pointcount.value)); syncPointCount(); }
    if (props.speed) speed = Number(props.speed.value);
    if (props.linecolor) { lineColor = weColor(props.linecolor.value); rebuildStyles(); }
  },
  setPaused: function (value) { paused = value; }
};
</script>
</body>
</html>
