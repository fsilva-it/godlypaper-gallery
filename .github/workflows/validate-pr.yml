name: Validate submission

# SECURITY: pull_request_target grants base-repo context. This job must carry
# NO secrets, and every script it runs comes from the BASE branch — never from
# the PR head. Only the submitted data files are read from the PR.
on:
  pull_request_target:
    paths: ["wallpapers/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout base (scripts)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout PR data into pr/
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate changed entries
        run: node scripts/validate-entry.mjs pr
