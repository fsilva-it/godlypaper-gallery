<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090d; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");

// ---- state (defaults mirror manifest.json) ----
var textColor = { r: 235, g: 240, b: 245 };  // "0.92 0.94 0.96"
var tint      = { r: 26,  g: 46,  b: 92  };  // "0.10 0.18 0.36"
var showDate = true;
var showSeconds = false;
var paused = false;
var dirty = true;      // force a redraw (resize, prop change, unpause)
var lastStamp = -1;    // whole-second timestamp of the last draw

var BASE = "#07090d";

// Pick the best available thin system face once. If a font shorthand fails
// to parse, ctx.font is left unchanged — so we probe with a sentinel size.
var FAMILY = (function () {
  var candidates = [
    '-apple-system, "Helvetica Neue", system-ui, sans-serif',
    'system-ui, sans-serif',
    'sans-serif'
  ];
  for (var i = 0; i < candidates.length; i++) {
    ctx.font = "100 100px " + candidates[i];
    if (ctx.font.indexOf("100px") !== -1) return candidates[i];
  }
  return "sans-serif";
})();

function resize() {
  canvas.width = Math.max(1, Math.round(innerWidth * devicePixelRatio));
  canvas.height = Math.max(1, Math.round(innerHeight * devicePixelRatio));
  dirty = true;
}
addEventListener("resize", resize);
resize();

function rgba(c, a) {
  return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")";
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }

function draw(now) {
  var W = canvas.width, H = canvas.height;

  // Base + slowly drifting radial tint. Redrawn once per second, and the
  // glow center completes an orbit over several minutes, so each step is
  // imperceptible — just a gentle ambient shift over the day.
  ctx.fillStyle = BASE;
  ctx.fillRect(0, 0, W, H);

  var t = now.getTime() / 1000;
  var gx = W * 0.50 + Math.cos(t * 0.0061) * W * 0.14;
  var gy = H * 0.42 + Math.sin(t * 0.0043) * H * 0.12;
  var grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H) * 0.85);
  grad.addColorStop(0, rgba(tint, 0.55));
  grad.addColorStop(1, rgba(tint, 0));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // ---- time ----
  var timeText = pad2(now.getHours()) + ":" + pad2(now.getMinutes()) +
                 (showSeconds ? ":" + pad2(now.getSeconds()) : "");

  // Fit: measure at a reference 100px, then scale to 80% width / 30% height.
  ctx.font = "100 100px " + FAMILY;
  var refW = ctx.measureText(timeText).width || 1;
  var size = Math.min(H * 0.30, 100 * (W * 0.80) / refW);

  var timeY = showDate ? H * 0.44 : H * 0.47;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "100 " + size.toFixed(1) + "px " + FAMILY;
  ctx.fillStyle = rgba(textColor, 0.95);
  ctx.fillText(timeText, W * 0.5, timeY);

  // ---- date ----
  if (showDate) {
    var dateText = now.toLocaleDateString(undefined, {
      weekday: "long", month: "long", day: "numeric"
    }).toUpperCase();
    var dateSize = Math.max(11 * devicePixelRatio, size * 0.095);
    var hasTracking = "letterSpacing" in ctx;
    if (hasTracking) ctx.letterSpacing = (dateSize * 0.28).toFixed(1) + "px";
    ctx.font = "300 " + dateSize.toFixed(1) + "px " + FAMILY;
    ctx.fillStyle = rgba(textColor, 0.50);
    ctx.fillText(dateText, W * 0.5, timeY + size * 0.58);
    if (hasTracking) ctx.letterSpacing = "0px";
  }
}

function frame() {
  if (!paused) {
    var now = new Date();
    var stamp = (now.getTime() / 1000) | 0;
    // Only work when the displayed second changes (or something is dirty);
    // every other frame is a single comparison.
    if (dirty || stamp !== lastStamp) {
      lastStamp = stamp;
      dirty = false;
      draw(now);
    }
  }
  requestAnimationFrame(frame);
}
frame();

// WE colors arrive as "r g b" float strings, e.g. "0.92 0.94 0.96".
function weColor(v) {
  var p = String(v).split(" ").map(parseFloat);
  return { r: Math.round(p[0] * 255), g: Math.round(p[1] * 255), b: Math.round(p[2] * 255) };
}

window.wallpaperPropertyListener = {
  applyUserProperties: function (props) {
    if (props.textcolor)   textColor = weColor(props.textcolor.value);
    if (props.tint)        tint = weColor(props.tint.value);
    if (props.showdate)    showDate = !!props.showdate.value;
    if (props.showseconds) showSeconds = !!props.showseconds.value;
    dirty = true;
  },
  setPaused: function (value) {
    paused = value;
    if (!value) dirty = true; // catch up immediately on resume
  }
};
</script>
</body>
</html>
