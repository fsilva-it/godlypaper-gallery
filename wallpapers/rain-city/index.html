<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #art { position: absolute; left: 0; top: 0; display: block; transform-origin: 50% 50%; }
  #fx, #glow, #vignette { position: absolute; inset: 0; pointer-events: none; }
  #fx { width: 100vw; height: 100vh; }
  #glow { mix-blend-mode: screen; opacity: 0; }
</style>
<script>window.ART_DEFAULTS = {"effect": {"value": "rain"}, "density": {"value": 1}, "speed": {"value": 1}, "particlecolor": {"value": "0.78 0.86 1"}, "fog": {"value": 0.3}, "glow": {"value": 0.35}, "glowcolor": {"value": "1 0.67 0.43"}, "vignette": {"value": 0.35}, "drift": {"value": false}};</script>
</head>
<body>
<img id="art" src="art.jpg" alt="">
<div id="glow"></div>
<canvas id="fx"></canvas>
<div id="vignette"></div>
<script>
"use strict";
// "Art scene": a still illustration shown 1:1 in device pixels (no runtime
// resampling, so it stays as sharp as the source) with cheap animated
// overlays on top. make-art-scene.py pre-sizes art.jpg to the panel's exact
// backing resolution; any other screen falls back to a cover fit.

var art = document.getElementById("art");
var canvas = document.getElementById("fx");
var ctx = canvas.getContext("2d");
var glowEl = document.getElementById("glow");
var vignetteEl = document.getElementById("vignette");

// --- state (defaults mirror manifest.json; overwritten by applyUserProperties) ---
var effect = "rain";              // none | rain | petals | fireflies | snow | dust
var density = 1;
var speed = 1;
var pcolor = { r: 200, g: 220, b: 255 };
var fog = 0;
var glow = 0;
var glowColor = { r: 255, g: 170, b: 110 };
var vignette = 0.35;
var drift = false;
var paused = false;

var t = 0, lastNow = 0, acc = 0;
var FRAME = 1 / 30;               // 30 fps cap: these run 24/7 behind icons
var W = 0, H = 0, dpr = 1;

// ---------- art placement: exact 1:1 when sizes match ----------
function layoutArt() {
  if (!art.naturalWidth) return;
  var vw = innerWidth, vh = innerHeight;
  var nw = art.naturalWidth, nh = art.naturalHeight;
  var s = Math.max(vw * dpr / nw, vh * dpr / nh);       // cover, in device px
  if (Math.abs(s - 1) < 0.02) s = 1;                     // snap: pixel-exact
  var dw = nw * s, dh = nh * s;                          // device px
  art.style.width = (dw / dpr) + "px";
  art.style.height = (dh / dpr) + "px";
  art.style.left = (Math.round((vw * dpr - dw) / 2) / dpr) + "px";
  art.style.top = (Math.round((vh * dpr - dh) / 2) / dpr) + "px";
}
art.addEventListener("load", layoutArt);

function rgba(c, a) { return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")"; }

function applyVignette() {
  vignetteEl.style.background = vignette > 0
    ? "radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0," + (0.75 * vignette).toFixed(3) + ") 100%)"
    : "none";
}
function applyGlowColor() {
  glowEl.style.background = "radial-gradient(ellipse at 50% 30%, " + rgba(glowColor, 0.55) + " 0%, " + rgba(glowColor, 0) + " 70%)";
}

// ---------- sprites (built once per color change) ----------
function makeCanvas(w, h) { var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

var dotSprite = makeCanvas(64, 64);      // fireflies / dust / snow
var petalSprite = makeCanvas(48, 32);
var fogTex = makeCanvas(1024, 384);

function buildSprites() {
  var g, c = dotSprite.getContext("2d");
  c.clearRect(0, 0, 64, 64);
  g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, rgba(pcolor, 1));
  g.addColorStop(0.25, rgba(pcolor, 0.55));
  g.addColorStop(1, rgba(pcolor, 0));
  c.fillStyle = g; c.fillRect(0, 0, 64, 64);

  c = petalSprite.getContext("2d");
  c.clearRect(0, 0, 48, 32);
  g = c.createLinearGradient(0, 0, 48, 32);
  g.addColorStop(0, rgba(pcolor, 0.95));
  g.addColorStop(1, "rgba(" + Math.min(255, pcolor.r + 20) + "," + Math.max(0, pcolor.g - 40) + "," + Math.max(0, pcolor.b - 20) + ",0.9)");
  c.fillStyle = g;
  c.beginPath();                          // notched cherry petal
  c.moveTo(2, 16);
  c.bezierCurveTo(10, 0, 34, 0, 44, 10);
  c.lineTo(38, 16); c.lineTo(44, 22);
  c.bezierCurveTo(34, 32, 10, 32, 2, 16);
  c.fill();
}

function buildFog() {
  var c = fogTex.getContext("2d");
  c.clearRect(0, 0, 1024, 384);
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = 0; i < 60; i++) {
    var x = rnd() * 1024, y = 120 + rnd() * 200, r = 60 + rnd() * 140;
    for (var k = -1; k <= 1; k++) {        // wrap horizontally so it tiles
      var g = c.createRadialGradient(x + k * 1024, y, 0, x + k * 1024, y, r);
      g.addColorStop(0, "rgba(235,240,255,0.10)");
      g.addColorStop(1, "rgba(235,240,255,0)");
      c.fillStyle = g;
      c.fillRect(x + k * 1024 - r, y - r, r * 2, r * 2);
    }
  }
}

// ---------- particles (fixed pool, no per-frame allocation) ----------
var MAX = 1400;
var px = new Float32Array(MAX), py = new Float32Array(MAX), pz = new Float32Array(MAX);
var pa = new Float32Array(MAX), pb = new Float32Array(MAX), pc = new Float32Array(MAX);
var count = 0;

function baseCount() {
  switch (effect) {
    case "rain": return 700;
    case "petals": return 90;
    case "fireflies": return 70;
    case "snow": return 420;
    case "dust": return 160;
    default: return 0;
  }
}

function spawn(i, anywhere) {
  pz[i] = 0.35 + Math.random() * 0.65;          // depth: 0.35 far .. 1 near
  px[i] = Math.random() * W;
  py[i] = anywhere ? Math.random() * H : -40 * dpr - Math.random() * H * 0.3;
  pa[i] = Math.random() * 6.283;                // phase
  pb[i] = 0.5 + Math.random();                  // per-particle speed jitter
  pc[i] = Math.random() * 6.283;                // rotation
  if (effect === "fireflies" || effect === "dust") py[i] = Math.random() * H;
}

function resetParticles() {
  count = Math.min(MAX, Math.round(baseCount() * density));
  for (var i = 0; i < count; i++) spawn(i, true);
}

function resize() {
  dpr = devicePixelRatio || 1;
  W = canvas.width = Math.round(innerWidth * dpr);
  H = canvas.height = Math.round(innerHeight * dpr);
  layoutArt();
  resetParticles();
}
addEventListener("resize", resize);

function step(dt) {
  t += dt;
  var i, z, s, wind = Math.sin(t * 0.21) * 0.6 + Math.sin(t * 0.07) * 0.4;
  ctx.clearRect(0, 0, W, H);

  if (fog > 0) {                                  // drifting mist, lower half
    var fw = W * 1.4, fh = fw * 384 / 1024, off = (t * 12 * dpr) % fw;
    ctx.globalAlpha = Math.min(1, fog);
    ctx.drawImage(fogTex, -off, H - fh * 0.85, fw, fh);
    ctx.drawImage(fogTex, fw - off, H - fh * 0.85, fw, fh);
    ctx.globalAlpha = 1;
  }

  if (effect === "rain") {
    ctx.strokeStyle = rgba(pcolor, 1);
    ctx.lineCap = "round";
    var slant = 0.12 + wind * 0.06;
    for (i = 0; i < count; i++) {
      z = pz[i];
      var v = (1400 + 900 * z) * dpr * pb[i] * 0.6 * dt;
      py[i] += v; px[i] += v * slant;
      if (py[i] > H + 40 * dpr) { spawn(i, false); px[i] = Math.random() * W * 1.1 - W * 0.1; }
      var len = (14 + 26 * z) * dpr;
      ctx.globalAlpha = 0.10 + 0.30 * z;
      ctx.lineWidth = (0.6 + 0.9 * z) * dpr;
      ctx.beginPath();
      ctx.moveTo(px[i], py[i]);
      ctx.lineTo(px[i] - len * slant, py[i] - len);
      ctx.stroke();
    }
  } else if (effect === "petals") {
    for (i = 0; i < count; i++) {
      z = pz[i];
      py[i] += (40 + 50 * z) * dpr * pb[i] * dt;
      px[i] += ((60 + 120 * wind) * z + 25 * Math.sin(t * 0.9 + pa[i])) * dpr * dt;
      pc[i] += (0.6 + pb[i]) * dt;
      if (py[i] > H + 30 * dpr || px[i] > W + 60 * dpr) { spawn(i, false); px[i] = Math.random() * W * 1.2 - W * 0.3; }
      s = (0.35 + 0.65 * z) * dpr;
      var flip = Math.cos(t * 1.7 * pb[i] + pa[i]);   // 3D tumble
      ctx.setTransform(s * flip, 0, 0, s, px[i], py[i]);
      ctx.rotate(pc[i]);
      ctx.globalAlpha = 0.45 + 0.55 * z;
      ctx.drawImage(petalSprite, -24, -16);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  } else if (effect === "snow") {
    for (i = 0; i < count; i++) {
      z = pz[i];
      py[i] += (25 + 55 * z) * dpr * pb[i] * dt;
      px[i] += (18 * Math.sin(t * 0.6 + pa[i]) + 30 * wind * z) * dpr * dt;
      if (py[i] > H + 10 * dpr) { spawn(i, false); }
      s = (3 + 7 * z) * dpr;
      ctx.globalAlpha = 0.35 + 0.6 * z;
      ctx.drawImage(dotSprite, px[i] - s, py[i] - s, s * 2, s * 2);
    }
  } else if (effect === "fireflies" || effect === "dust") {
    var ff = effect === "fireflies";
    ctx.globalCompositeOperation = "lighter";
    for (i = 0; i < count; i++) {
      z = pz[i];
      var sp = (ff ? 22 : 9) * dpr * pb[i];
      px[i] += Math.cos(t * 0.31 * pb[i] + pa[i]) * sp * dt + (ff ? 0 : 4 * dpr * dt);
      py[i] += Math.sin(t * 0.23 * pb[i] + pa[i] * 1.7) * sp * dt - (ff ? 0 : 3 * dpr * dt);
      if (px[i] < -50 * dpr) px[i] += W + 100 * dpr; else if (px[i] > W + 50 * dpr) px[i] -= W + 100 * dpr;
      if (py[i] < -50 * dpr) py[i] += H + 100 * dpr; else if (py[i] > H + 50 * dpr) py[i] -= H + 100 * dpr;
      var pulse = ff ? Math.max(0, Math.sin(t * 1.3 * pb[i] + pa[i])) : 0.6 + 0.4 * Math.sin(t * 0.5 + pa[i]);
      s = (ff ? 14 + 20 * z : 2 + 4 * z) * dpr;
      ctx.globalAlpha = (ff ? 1 : 0.35) * (ff ? 0.25 + 0.75 * pulse : pulse) * (0.4 + 0.6 * z);
      ctx.drawImage(dotSprite, px[i] - s, py[i] - s, s * 2, s * 2);
    }
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.globalAlpha = 1;

  glowEl.style.opacity = glow > 0 ? (glow * (0.22 + 0.10 * Math.sin(t * 0.8) + 0.04 * Math.sin(t * 2.3))).toFixed(3) : "0";
  art.style.transform = drift
    ? "scale(1.03) translate(" + (Math.sin(t * 0.05) * 0.8).toFixed(3) + "%," + (Math.sin(t * 0.037) * 0.5).toFixed(3) + "%)"
    : "";
}

function frame(now) {
  requestAnimationFrame(frame);
  if (paused) { lastNow = now; return; }          // loop alive, zero work
  var dt = Math.min((now - lastNow) / 1000, 0.1);
  lastNow = now;
  acc += dt;
  if (acc < FRAME) return;
  step(Math.min(acc, 0.1) * speed);
  acc = 0;
}

buildSprites(); buildFog(); applyVignette(); applyGlowColor();
resize();
requestAnimationFrame(frame);

function weColor(v) {
  var p = String(v).split(" ").map(parseFloat);
  return { r: Math.round(p[0] * 255), g: Math.round(p[1] * 255), b: Math.round(p[2] * 255) };
}

window.wallpaperPropertyListener = {
  applyUserProperties: function (props) {
    var reset = false;
    if (props.effect) { effect = String(props.effect.value); reset = true; }
    if (props.density) { density = Number(props.density.value); reset = true; }
    if (props.speed) speed = Number(props.speed.value);
    if (props.particlecolor) { pcolor = weColor(props.particlecolor.value); buildSprites(); }
    if (props.fog) fog = Number(props.fog.value);
    if (props.glow) glow = Number(props.glow.value);
    if (props.glowcolor) { glowColor = weColor(props.glowcolor.value); applyGlowColor(); }
    if (props.vignette) { vignette = Number(props.vignette.value); applyVignette(); }
    if (props.drift) drift = !!props.drift.value;
    if (reset) resetParticles();
  },
  setPaused: function (value) { paused = value; }
};
// Per-scene defaults baked in by make-art-scene.py (the app re-sends the
// user's values right after load; this covers previews and first paint).
if (window.ART_DEFAULTS) window.wallpaperPropertyListener.applyUserProperties(window.ART_DEFAULTS);
</script>
</body>
</html>
